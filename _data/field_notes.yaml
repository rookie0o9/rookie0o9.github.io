notes:
  - type: incident log
    title: "Notes from a Conditional Access Cleanup"
    lesson: "Most policy drift came from exceptions that never expired. The fix was a review cadence, not a bigger policy set."
    command: "Get-MgIdentityConditionalAccessPolicy | Select-Object DisplayName,State"

  - type: field note
    title: "I Trust Logs, Just Not Blindly"
    lesson: "Correlating audit trails with user behaviour and service context catches what single-source log reading misses."
    command: "Search-UnifiedAuditLog -StartDate $start -EndDate $end -Operations UserLoggedIn"

  - type: repair log
    title: "What I Check Before Blaming SMTP"
    lesson: "Scan-to-email failures are often auth, DNS, or TLS profile mismatch before they are transport failures."
    command: "Test-NetConnection smtp.office365.com -Port 587"

  - type: ops note
    title: "Tiny Fixes That Quietly Improve Security"
    lesson: "Naming standards for admin accounts and runbook links inside tickets reduced escalation time more than any tooling change."
    command: "Get-IntuneManagedDevice | Select DeviceName,ComplianceState"
