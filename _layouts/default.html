<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.data.main_info.name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: 'Personal blog and development projects by Adeniyi A. Azeez.' }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.data.main_info.name }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fixam.co.uk{{ page.url | relative_url }}">
  <meta property="og:description" content="{{ page.description | default: 'Personal blog and development projects by Adeniyi A. Azeez.' }}">
  <link rel="canonical" href="https://fixam.co.uk{{ page.url | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/libs/custom/my_css.css' | relative_url }}">
</head>
<body>
  <div class="bg-orb orb-one" aria-hidden="true"></div>
  <div class="bg-orb orb-two" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.main_info.name }}</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="site-nav" id="site-nav">
        <a href="{{ '/index.html' | relative_url }}">Home</a>
        <a href="{{ '/projects.html' | relative_url }}">Projects</a>
        <a href="{{ '/blog.html' | relative_url }}">Blog</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>{{ site.data.main_info.name }} · London, UK</p>
      <p class="footer-links">
        <a href="mailto:{{ site.data.main_info.email }}">Email</a>
        <a href="{{ site.data.main_info.linkedin }}" target="_blank" rel="noreferrer">LinkedIn</a>
        <a href="{{ site.data.main_info.github }}" target="_blank" rel="noreferrer">GitHub</a>
      </p>
    </div>
  </footer>

  <script>
    (function () {
      var button = document.querySelector('.menu-toggle');
      var nav = document.getElementById('site-nav');
      if (!button || !nav) {
        return;
      }

      button.addEventListener('click', function () {
        var expanded = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', String(!expanded));
        nav.classList.toggle('open');
      });
    })();
  </script>

  {% include google_analytics.html %}
</body>
</html>
