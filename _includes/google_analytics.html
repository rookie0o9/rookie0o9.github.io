{% assign ga_tracking_id = site.data.main_info.google_analytics_tracking_id | default: site.data.main_info.google_analystics_tracking_id %}
{% if ga_tracking_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_tracking_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ ga_tracking_id }}');
</script>
{% endif %}
